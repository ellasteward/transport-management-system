<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="nav">

        <div class="nav-left">
            <a href="/drivers.html" id="manageDriversLink">
                Manage Drivers
            </a>
            <a href="/calendar.html">Calendar</a>
        </div>

        <div class="nav-right">
            <a href="/login.html">Logout</a>
        </div>

    </div>

    <h1>Admin Dashboard</h1>

    <div class="section">
        <h2>Create Job</h2>

        <div class="create-job-form">

            <div class="create-job-row">
                <div>
                    <label>Pickup Location</label><br>
                    <input type="text" id="pickupLocation">
                </div>

                <div>
                    <label>Delivery Location</label><br>
                    <input type="text" id="deliveryLocation">
                </div>
            </div>

            <div class="create-job-row">
                <div>
                    <label>Date</label><br>
                    <input type="date" id="jobDate">
                </div>

                <div>
                    <label>Weight (kg)</label><br>
                    <input type="number" id="weight">
                </div>
            </div>

            <div class="create-job-row">
                <div>
                    <label>Truck Type</label><br>
                    <select id="truckType">
                        <option value="TRUCK">TRUCK</option>
                        <option value="HIAB">HIAB</option>
                        <option value="TRUCK_TRAILER">TRUCK_TRAILER</option>
                    </select>
                </div>

                <div>
                    <label>Driver</label><br>
                    <select id="driverId"></select>
                </div>
            </div>

            <div class="create-job-row">
                <div style="width:100%;">
                    <label>Comments</label><br>
                    <input type="text" id="comments" style="width:100%;">
                </div>
            </div>

            <button onclick="createJob()">Create Job</button>

        </div>

        <div class="section">

            <h2>All Jobs</h2>

            <div class="job-filters">

                <div>
                    <label>Select Date</label><br>
                    <input type="date" id="filterDate">
                </div>

                <div>
                    <label>Driver</label><br>
                    <select id="filterDriver">
                        <option value="">All Drivers</option>
                    </select>
                </div>

                <div>
                    <label>Status</label><br>
                    <select id="filterStatus">
                        <option value="">All Status</option>
                        <option value="PENDING">Pending</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>

                <div class="filter-buttons">
                    <button onclick="loadFilteredJobs()">Filter Jobs</button>
                    <button class="btn-secondary" onclick="loadJobs()">
                        Load All Jobs
                    </button>
                </div>

            </div>

            <table id="jobTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Route</th>
                    <th>Date</th>
                    <th>Weight</th>
                    <th>Truck</th>
                    <th>Driver</th>
                    <th>Status</th>
                    <th>Comments</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="jobTableBody"></tbody>

            </table>

        </div>


</div>
    <script>

        const username =
            localStorage.getItem("username");

        if (
            username &&
            username.toLowerCase().includes("dispatch")
        ) {

            const link =
                document.getElementById("manageDriversLink");

            if (link) {
                link.style.display = "none";
            }
        }

    </script>

<script src="admin.js"></script>
</body>
</html>
