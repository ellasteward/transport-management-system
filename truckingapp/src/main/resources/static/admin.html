<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="nav">
        <a href="/driver.html">Driver Dashboard</a>
        <a href="/drivers.html">Manage Drivers</a>
        <a href="/login.html">Logout</a>
        <a href="/calendar.html">Calendar</a>
    </div>

    <h1>Admin Dashboard</h1>

    <div class="section">
        <h2>Create Job</h2>

        <form id="jobForm" class="form-box">

            <label>Pickup Location</label>
            <input type="text" id="pickupLocation" required>

            <label>Delivery Location</label>
            <input type="text" id="deliveryLocation" required>

            <label>Date</label>
            <input type="date" id="jobDate">

            <label>Weight (kg)</label>
            <input type="number" id="weight">

            <label>Truck Type</label>
            <select id="truckType" onchange="filterDrivers()">
                <option value="HIAB">HIAB</option>
                <option value="TRUCK">Truck</option>
                <option value="TRUCK_TRAILER">Truck & Trailer</option>
            </select>

            <label>Driver</label>
            <select id="driverId"></select>

            <label>Comments</label>
            <input type="text" id="comments">

            <button type="submit">Create Job</button>

        </form>
    </div>

    <div class="section">
        <h2>All Jobs</h2>
        <button onclick="loadJobs()">Load Jobs</button>
        <table id="jobTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Route</th>
                <th>Date</th>
                <th>Weight</th>
                <th>Truck</th>
                <th>Driver</th>
                <th>Status</th>
                <th>Comments</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="jobTableBody"></tbody>
        </table>
    </div>

    <div class="section">
        <label>Select Date</label>
        <input type="date" id="filterDate">
        <button onclick="loadJobsByDate()">View Jobs</button>
    </div>

</div>


<script src="admin.js"></script>
</body>
</html>
