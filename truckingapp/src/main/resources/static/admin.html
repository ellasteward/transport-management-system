<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <!-- NAVIGATION -->
    <div style="display:flex; justify-content:space-between;">
        <a href="/driver.html">Driver Dashboard</a>
        <a href="/login.html">Logout</a>
    </div>

    <h1>Admin Dashboard</h1>

    <div class="section">
        <h2>Create Job</h2>
        <form id="jobForm" class="form-box">

            <label>Pickup Location</label>
            <input type="text" id="pickupLocation" required>

            <label>Delivery Location</label>
            <input type="text" id="deliveryLocation" required>

            <label>Driver ID</label>
            <input type="number" id="driverId" required>

            <button type="submit">Create Job</button>
        </form>

        <p id="jobMessage"></p>
    </div>

    <div class="section">
        <h2>All Jobs</h2>
        <button onclick="loadJobs()">Load Jobs</button>
        <div id="jobsList"></div>
    </div>

</div>

<script src="admin.js"></script>

</body>
</html>
