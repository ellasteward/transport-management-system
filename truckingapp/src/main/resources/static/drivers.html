<!DOCTYPE html>
<html>
<head>
    <title>Drivers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="nav">
        <a href="/admin.html">Back</a>
        <a href="/login.html">Logout</a>
    </div>

    <h1>Driver / Dispatcher Management</h1>

    <div class="driver-form">

        <div class="form-group">
            <input id="driverName" placeholder="Name">
        </div>

        <div class="form-group">
            <input id="driverPhone" placeholder="Phone">
        </div>

        <div class="form-group">
            <input id="licenseNumber" placeholder="License">
        </div>

        <div class="form-group">
            <input id="driverUsername" placeholder="Username">
        </div>

        <div class="form-group">
            <input id="driverPassword" placeholder="Password">
        </div>

        <div class="form-group">
            <select id="userRole">
                <option value="DRIVER">Driver</option>
                <option value="DISPATCHER">Dispatcher</option>
            </select>
        </div>

        <div class="form-group" id="truckTypeSection">
            <select id="driverTruckType">
                <option value="HIAB">HIAB</option>
                <option value="TRUCK">TRUCK</option>
                <option value="TRUCK_TRAILER">Truck & Trailer</option>
            </select>
        </div>

        <button id="createDriverBtn" onclick="createDriver()">
            Create
        </button>

    </div>
    <h3 class="driver-section-title">All Drivers</h3>
    <div id="driverList"></div>

</div>

<script src="drivers.js"></script>
</body>
</html>
