<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TruckTruck Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="nav">
        <a href="/admin.html">Admin Dashboard</a>
        <a href="/login.html">Logout</a>
    </div>

    <h1> Job Calendar</h1>

    <div class="section">
        <label>Select Week Starting</label>
        <input type="date" id="weekStart">

        <button onclick="loadWeekJobs()">Load Week</button>
    </div>

    <table id="calendarTable">
        <thead>
        <tr>
            <th>Date</th>
            <th>Route</th>
            <th>Driver</th>
            <th>Truck</th>
            <th>Weight</th>
        </tr>
        </thead>
        <tbody id="calendarBody"></tbody>
    </table>
</div>

<script src="calendar.js"></script>
</body>
</html>
