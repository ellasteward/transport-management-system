<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Driver Dashboard</h1>

  <div class="section">
    <h2>View My Jobs</h2>

    <label for="driverId">Enter Driver ID</label>
    <input type="number" id="driverId">

    <button onclick="loadDriverJobs()">Load My Jobs</button>
  </div>

  <div class="section">
    <h2>My Assigned Jobs</h2>
    <div id="driverJobsList"></div>
  </div>
</div>

<script src="driver.js"></script>
</body>
</html>
