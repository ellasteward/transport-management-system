<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TruckTruck Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>TruckTruck</h1>
    <h2>Login</h2>

    <form method="post" action="/login" class="form-box">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <p class="note">
        Admin → <a href="/admin.html">Go to Admin Dashboard</a><br>
        Driver → <a href="/driver.html">Go to Driver Dashboard</a>
    </p>
</div>
</body>
</html>
