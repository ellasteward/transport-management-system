<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TruckTruck Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!--
    Simple login page for TruckTruck.
    I kept the design lightweight and easy to use so
    drivers and dispatchers can log in quickly while working.
-->

<div class="login-container">

    <div class="login-card">
        <h1>TruckTruck</h1>
        <p class="subtitle">Transport Management System</p>

        <form id="loginForm">

            <!-- Username input -->
            <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
            >

            <!-- Password input -->
            <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
            >

            <!-- Login button -->
            <button type="submit">Login</button>

        </form>

        <!-- Error message if login fails -->
        <p id="error" class="error"></p>
    </div>

</div>

<script src="login.js"></script>

</body>
</html>
